<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DHB — Soo Gelid</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-logo">DHB</div>
  <div class="login-title">DHB Field Registration</div>
  <div class="login-sub">Foorma Caddeynta Hanti Ma Guuratda<br>Bosaso, Somalia</div>

  <div class="login-box">
    <div class="form-group">
      <label class="form-label">Magaca Isticmaalaha (Username)</label>
      <input class="form-input" id="username" type="text" placeholder="Geli magacaaga" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label class="form-label">Furaha (Password)</label>
      <input class="form-input" id="password" type="password" placeholder="Geli furaha" autocomplete="current-password" required>
    </div>
    <div class="form-group">
      <label class="form-label">Magaca Magaalada (City Code)</label>
      <input class="form-input" id="city-code" type="text" placeholder="Tusaale: BOS" autocomplete="off" required>
      <div class="form-hint">City code-ka ayaa go'aamiya magaaladaada</div>
    </div>
    <button class="btn btn-primary" id="btn-login">Soo Gelid</button>

    <div style="margin-top:16px;text-align:center">
      <button class="btn btn-outline btn-sm" id="btn-admin-login" style="width:auto;display:inline-flex">Maamulaha (Admin)</button>
      <button class="btn btn-warn btn-sm" id="btn-demo" style="width:auto;display:inline-flex;margin-left:4px">Demo Mode</button>
    </div>
  </div>

  <div class="login-footer">DHB Land Registration System v1.0</div>
</div>

<!-- Admin Login Modal -->
<div class="modal-overlay" id="admin-modal">
  <div class="modal">
    <h3>Admin Login</h3>
    <div class="form-group">
      <label class="form-label">Admin Username</label>
      <input class="form-input" id="admin-user" type="text" placeholder="Admin username">
    </div>
    <div class="form-group">
      <label class="form-label">Admin Password</label>
      <input class="form-input" id="admin-pass" type="password" placeholder="Admin password">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="admin-cancel">Cancel</button>
      <button class="btn btn-primary" id="admin-login-btn">Login</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
<script>
(function(){
  /* Pre-fill remembered city code */
  var savedCity = localStorage.getItem('dhb_city');
  if(savedCity) document.getElementById('city-code').value = savedCity;

  document.getElementById('btn-login').onclick = function(){
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value.trim();
    var cityCode = document.getElementById('city-code').value.trim().toUpperCase();

    if(!username || !password || !cityCode){
      APP.toast('Fadlan buuxi dhammaan goobaha', 'error');
      return;
    }

    AUTH.login(username, password, cityCode).then(function(data){
      APP.toast('Soo gelid waa guul!', 'success');
      localStorage.setItem('dhb_city', cityCode);
      setTimeout(function(){ location.href = 'dashboard.html' }, 500);
    }).catch(function(err){
      APP.toast(err.message, 'error');
    });
  };

  /* Demo mode — no backend needed */
  document.getElementById('btn-demo').onclick = function(){
    var username = document.getElementById('username').value.trim() || 'engineer1';
    var password = document.getElementById('password').value.trim() || 'eng123';
    var cityCode = document.getElementById('city-code').value.trim().toUpperCase() || 'BOS';

    AUTH.demoLogin(username, password, cityCode).then(function(){
      APP.toast('Demo mode: Soo gelid waa guul!', 'success');
      localStorage.setItem('dhb_city', cityCode);
      setTimeout(function(){ location.href = 'dashboard.html' }, 500);
    }).catch(function(err){
      APP.toast(err.message, 'error');
    });
  };

  /* Enter key support */
  document.getElementById('password').onkeydown = function(e){
    if(e.key === 'Enter') document.getElementById('btn-login').click();
  };

  /* Admin modal */
  document.getElementById('btn-admin-login').onclick = function(){
    document.getElementById('admin-modal').classList.add('show');
  };

  document.getElementById('admin-cancel').onclick = function(){
    document.getElementById('admin-modal').classList.remove('show');
  };

  document.getElementById('admin-login-btn').onclick = function(){
    var u = document.getElementById('admin-user').value.trim();
    var p = document.getElementById('admin-pass').value.trim();
    if(!u || !p){ APP.toast('Fadlan buuxi admin credentials', 'error'); return }
    AUTH.adminLogin(u, p).then(function(){
      APP.toast('Admin login guul!', 'success');
      document.getElementById('admin-modal').classList.remove('show');
      setTimeout(function(){ location.href = 'admin.html' }, 500);
    }).catch(function(err){
      APP.toast(err.message, 'error');
    });
  };

  /* Auto-logout if already logged in and session valid */
  if(APP.getToken()){
    AUTH.checkSession().then(function(valid){
      if(valid){
        var role = APP.getRole();
        if(role === 'admin') location.href = 'admin.html';
        else location.href = 'dashboard.html';
      }
    });
  }
})();
</script>
</body>
</html>
