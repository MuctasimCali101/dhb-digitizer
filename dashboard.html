<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DHB — Dashboard</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="logo">
      <div class="logo-icon">DHB</div>
      <div>
        <div class="logo-text">DHB Field Registration</div>
        <div class="header-sub" id="header-city">---</div>
      </div>
    </div>
    <div class="header-right">
      <span style="font-size:11px;color:var(--text3)" id="header-user"></span>
      <button class="btn btn-sm btn-outline" onclick="APP.logout()" style="width:auto">Bax</button>
    </div>
  </header>

  <div class="app-content" id="app-content">
    <!-- Summary Cards -->
    <div class="summary-grid" id="summary-cards">
      <div class="summary-card accent"><div class="num" id="stat-today">0</div><div class="label">Maanta</div></div>
      <div class="summary-card accent"><div class="num" id="stat-month">0</div><div class="label">Bishan</div></div>
      <div class="summary-card"><div class="num" id="stat-area">0 m²</div><div class="label">Bedka Guud</div></div>
      <div class="summary-card"><div class="num" id="stat-drafts">0</div><div class="label">Kayd Qabyo</div></div>
    </div>

    <!-- Recent Submissions -->
    <div class="card">
      <div class="card-title">Gudbinta ugu Dambeeyay</div>
      <div id="recent-list" style="font-size:12px;color:var(--text2)">
        <p style="text-align:center;padding:20px;color:var(--text3)">Xog lagu soo rarayaa...</p>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="app-footer">
    <button class="nav-item active" data-page="dashboard.html" onclick="location.href='dashboard.html'">
      <span class="nav-icon">\ud83c\udfe0</span> Dashboard
    </button>
    <button class="nav-item" data-page="form.html" onclick="location.href='form.html'">
      <span class="nav-icon">\ud83d\udcdd</span> Cusub
    </button>
    <button class="nav-item" data-page="digitizer.html" onclick="location.href='digitizer.html'">
      <span class="nav-icon">\ud83d\uddfa</span> Khariidad
    </button>
    <button class="nav-item" data-page="submissions.html" onclick="location.href='submissions.html'">
      <span class="nav-icon">\ud83d\udcca</span> Gudbin
    </button>
  </nav>

  <!-- FAB -->
  <button class="fab" onclick="location.href='form.html'" aria-label="New Registration">+</button>
</div>

<div id="toast-container"></div>

<script src="assets/js/app.js"></script>
<script src="assets/js/api.js"></script>
<script>
(function(){
  if(!APP.requireAuth()) return;

  document.getElementById('header-user').textContent = APP.getUser();
  document.getElementById('header-city').textContent = APP.getCityName() || APP.getCity();

  function loadDashboard(){
    API.getSubmissions().then(function(data){
      var rows = data.submissions || [];
      var list = document.getElementById('recent-list');

      /* Stats */
      var today = APP.today();
      var thisMonth = today.slice(0,7);
      var todayCount = 0, monthCount = 0, totalArea = 0, draftCount = 0;

      rows.forEach(function(r){
        var d = (r['Taariikhda (Date)'] || '').slice(0,10);
        if(d === today) todayCount++;
        if(d.slice(0,7) === thisMonth) monthCount++;
        totalArea += parseFloat(r['Bedka m\u00b2 (Area)']) || 0;
        if(r._status === 'draft') draftCount++;
      });

      document.getElementById('stat-today').textContent = todayCount;
      document.getElementById('stat-month').textContent = monthCount;
      document.getElementById('stat-area').textContent = totalArea.toFixed(0) + ' m\u00b2';
      document.getElementById('stat-drafts').textContent = draftCount;

      /* Recent list */
      if(rows.length === 0){
        list.innerHTML = '<p style="text-align:center;padding:20px;color:var(--text3)">Weli ma jiro gudbin</p>';
        return;
      }

      var html = '';
      var recent = rows.slice(-10).reverse();
      recent.forEach(function(r){
        var name = r['Magaca Milkiilaha (Owner Name)'] || 'Unknown';
        var date = (r['Taariikhda (Date)'] || '').slice(0,10);
        var id = r['Gudbinta ID (Submission ID)'] || '';
        html += '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer" onclick="location.href=\'submissions.html?id=' + id + '\'">' +
          '<div><div style="font-weight:600;color:var(--text)">' + APP.esc(name) + '</div><div style="font-size:10px;color:var(--text3)">' + date + '</div></div>' +
          '<div style="text-align:right"><div class="status-badge status-submitted">Dhammaystiran</div><div style="font-size:10px;color:var(--text3);margin-top:2px">' + id.slice(-6) + '</div></div>' +
        '</div>';
      });
      list.innerHTML = html;
    }).catch(function(err){
      document.getElementById('recent-list').innerHTML = '<p style="text-align:center;padding:20px;color:var(--warn)">Khalad: ' + APP.esc(err.message || 'Server lama gaarin') + '</p>';
    });
  }

  loadDashboard();
})();
</script>
</body>
</html>
